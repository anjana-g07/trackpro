<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TrackPro</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fef3c7;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .login-box h1 {
            text-align: center;
            color: #f59e0b;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        .login-box input:focus {
            border-color: #f59e0b;
        }

        .login-box button {
            width: 100%;
            padding: 14px;
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .login-box button:hover {
            background: #d97706;
        }

        .register {
            margin-top: 20px;
            text-align: center;
        }

        .register a {
            color: #d97706;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <h1>📦 TrackPro</h1>

        <p>Delivery Tracking System</p>

        <form onsubmit="loginUser(event)">

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">🔐 Login</button>

        </form>

        <div class="register">
            Don't have an account?
            <a href="#" onclick="registerUser()">Register</a>
        </div>

    </div>

</div>

<script>

function loginUser(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
        alert("⚠️ Please enter email and password");
        return;
    }

    localStorage.setItem("trackProLoggedIn", "true");

    alert("✅ Login successful!");

    window.location.href = "index.html";
}

function registerUser() {

    alert("📝 Registration feature is simulated for this project.");

}

</script>

</body>
</html>
